<div class="swipe-calculator-body">
    <div class="swipe-calculator-header">
        <div class="app-details-header">
            <h1>Swipe Calculator</h1>
            <h4>Paste your door-swipe records. Swipes alternate: 1st is in, 2nd is out, 3rd is in, and so on.</h4>
        </div>
        <div class="system-info-header">
            <div class="system-time">
                SYSTEM TIME
            </div>
            <div class="system-date-and-time">
                <div class="system-time-display">
                    <span>{{ currentDateTime | date:'HH:mm:ss' }}</span>
                </div>
                <div class="system-date">
                    <mat-icon>calendar_today</mat-icon>
                    <span>{{ currentDateTime | date:'dd MMM yyyy' }}</span>
                </div>
            </div>
        </div>
    </div>
    <div class="swipe-calculation-main-body-container">
        <div class = "swipe-records-deatils-input">
            <h3>Swipe Records</h3>
            <textarea class = "input-text-area",placeholder="Please paste the swipe records.", rows="20",>
            </textarea>
            <div class="swipe-calculation-buttons-container">
                <!-- <div>
                    <button>Calculate</button>
                </div>
                <div>
                    <button>Clear</button>
                </div> -->
            </div>>
        </div>
        <!-- <div class= "swipe-calculation-results-container">

    </div>
</div>
