<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swipe Calculator</title>
</head>
<body class="swipe-calculator-body">
    <div class="swipe-calculator-header">
        <div class="app-details-header">
            <h1>Swipe Calculator</h1>
            <h4>Paste your door-swipe records. Swipes alternate: 1st is in, 2nd is out, 3rd is in, and so on.</h4>
        </div>
        <div class="system-info-header">
            <div class="system-time">
                SYSTEM TIME
            </div>
        </div>
    </div>
    <div class = "swipe-calculator-content">
        <p>Swipe left or right to calculate the result.</p>
    </div>
    <div class="swipe-calculator-footer">
        </div>
</body>
</html>
